[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot-defect-inspector"
version = "0.1.0"
description = "Few-shot patch-memory anomaly inspection with a reproducible lighting-shift experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<14", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "torch>=2.2,<3", "torchvision>=0.17,<1"]

[project.scripts]
defect-inspector = "inspector.cli:main"

[tool.setuptools.packages.find]
include = ["inspector*"]
